# Render Blueprint — deploys the Reality Lock backend on the free tier.
# Phase 0 requires a health-check route answering from a *deployed* URL.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
#   New → Blueprint  and point it at the repository. No dashboard fields to
#   fill in by hand; everything below is declarative.
#
# NOTE on rootDir: the service builds from `backend/`, but Render clones the
# whole repository, so `docs/design/proof-package.schema.json` — which lives
# OUTSIDE backend/ and is the contract shared with the Android app — is still
# on disk at runtime. That is deliberate: the schema is never duplicated.
services:
  - type: web
    name: reality-lock-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render; src/config reads it via envInt('PORT', 3000).
      # Matches backend/src/config/index.js's actual env var name (`ALLOWED_ORIGINS`
      # — see backend/.env.example). This was previously named CORS_ORIGIN here,
      # which the code never reads: harmless today only because both "mean" the
      # same default (*), but setting CORS_ORIGIN in the dashboard to restrict
      # origins would have silently done nothing.
      - key: ALLOWED_ORIGINS
        value: "*"
      # Number of reverse proxies in front of the app. Render terminates TLS at
      # its own load balancer and appends the caller to X-Forwarded-For, so the
      # count is 1.
      #
      # This is a security setting, not a tuning knob. It must never be `true`:
      # Express would then take the LEFT-most X-Forwarded-For entry as the client
      # address, and that entry is written by the caller — so anyone could rotate
      # it per request and walk through the rate limiter below. A count makes
      # Express read from the right, where only a real proxy can append. The
      # config refuses `true` and negative values outright.
      #
      # If a 429 never fires in production, or every caller shares one bucket,
      # this number is wrong for the current Render topology — recheck it before
      # assuming the limiter itself is broken.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Per-IP allowance for /proof and /verify, which share a single bucket.
      # /health is limited separately and far more loosely (see config), because
      # 429-ing Render's own health check would take the service out of rotation.
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
