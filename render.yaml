# Render Blueprint — deploys the Reality Lock backend on the free tier.
# Phase 0 requires a health-check route answering from a *deployed* URL.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
#   New → Blueprint  and point it at the repository. No dashboard fields to
#   fill in by hand; everything below is declarative.
#
# NOTE on rootDir: the service builds from `backend/`, but Render clones the
# whole repository, so `docs/design/proof-package.schema.json` — which lives
# OUTSIDE backend/ and is the contract shared with the Android app — is still
# on disk at runtime. That is deliberate: the schema is never duplicated.
services:
  - type: web
    name: reality-lock-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render; src/config reads it via envInt('PORT', 3000).
      # Matches backend/src/config/index.js's actual env var name (`ALLOWED_ORIGINS`
      # — see backend/.env.example). This was previously named CORS_ORIGIN here,
      # which the code never reads: harmless today only because both "mean" the
      # same default (*), but setting CORS_ORIGIN in the dashboard to restrict
      # origins would have silently done nothing.
      - key: ALLOWED_ORIGINS
        value: "*"
      # Number of reverse proxies in front of the app. Render terminates TLS at
      # its own load balancer and appends the caller to X-Forwarded-For, so the
      # count is 1.
      #
      # This is a security setting, not a tuning knob. It must never be `true`:
      # Express would then take the LEFT-most X-Forwarded-For entry as the client
      # address, and that entry is written by the caller — so anyone could rotate
      # it per request and walk through the rate limiter below. A count makes
      # Express read from the right, where only a real proxy can append. The
      # config refuses `true` and negative values outright.
      #
      # If a 429 never fires in production, or every caller shares one bucket,
      # this number is wrong for the current Render topology — recheck it before
      # assuming the limiter itself is broken.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Per-IP allowance for /proof and /verify, which share a single bucket.
      # /health is limited separately and far more loosely (see config), because
      # 429-ing Render's own health check would take the service out of rotation.
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      # Proof-of-possession on the two endpoints that disclose content:
      # GET /proof/:eventId (carries GPS) and /proof/:eventId/media (the photo).
      # GET /verify/:eventId stays public — a verdict carries no coordinates, and
      # anyone being able to check a claim is the point of the system.
      #
      # Turning this off reverts those endpoints to "knowing the UUID is enough".
      # Only true/false/1/0/yes/no/on/off parse; anything else stops the process
      # rather than quietly failing open.
      - key: PROOF_READ_AUTH
        value: "true"
      # RFC 3161 time anchoring. ON here and OFF by default in config, because
      # enabling it makes the ingest path perform an outbound call — fine for a
      # deployed service, wrong as a default that every unit test would inherit.
      #
      # Best-effort by construction: if the TSA is unreachable the package is
      # still stored and the anchor checks report `unavailable`. A timestamp
      # authority being down is not evidence about a capture.
      - key: TIMESTAMP_ANCHOR_ENABLED
        value: "true"
      # DigiCert: no account, no published rate limit, and its responder chains
      # to DigiCert Trusted Root G4 which Node already bundles — so no
      # certificate ships with this service and none can go stale.
      #
      # Do NOT substitute freetsa.org here without also solving trust. It is the
      # most-recommended free TSA and it does NOT chain to any public root (probed
      # 2026-08-07: "No valid certificate paths found"), so using it would mean
      # pinning a self-signed CA. Same for timestamp.acs.microsoft.com.
      # `node backend/scripts/ops/probe_tsa.js` re-checks any candidate.
      - key: TIMESTAMP_ANCHOR_TSA_URL
        value: "http://timestamp.digicert.com"
      # NOTE — not set here, and worth understanding before relying on the limit
      # above: without REDIS_URL the limiter counts per process. A probe on
      # 2026-08-06 found this deployment answering from THREE independent
      # counters, so RATE_LIMIT_MAX was effectively ~300, not 100. Add a Redis
      # instance and set REDIS_URL to make the configured number the real one.
      # - key: REDIS_URL
      #   fromService: ...
