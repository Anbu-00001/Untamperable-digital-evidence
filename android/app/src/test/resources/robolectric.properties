# Robolectric runs its simulated framework at this API level.
#
# Why not 36, which is the project's compileSdk/targetSdk: Robolectric's
# `android-all` artifact for SDK 36 requires Java 21, and this project's
# toolchain is Java 17 ("Android SDK 36 requires Java 21 (have Java 17)").
# Raising the toolchain to satisfy a *test* runtime would change the compiler
# used for the shipped release APK — the one already validated on real hardware —
# so the test runtime is pinned down instead of the product being moved up.
#
# The honest cost: these tests exercise API 35 behaviour, not API 36. That is
# acceptable because what they cover (sensor buffering, mock-location mapping)
# has no API-36-specific behaviour, and the tests that must span API levels
# declare their own with `@Config(sdk = ...)` rather than relying on this default.
sdk=35
